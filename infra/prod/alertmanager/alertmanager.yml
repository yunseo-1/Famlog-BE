# 운영 Alertmanager: 알림은 Discord 로 받는다 (2026-11-25 사용자 결정).
# 웹훅 주소는 비밀이라 파일로만 넣는다: 서버의 /opt/famlog/secrets/discord-webhook-url (docs/runbooks/deploy.md)
route:
  receiver: discord
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord-webhook-url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [FamLog] {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
