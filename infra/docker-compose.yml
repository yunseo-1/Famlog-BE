# FamLog 로컬 개발 인프라 (사양서 13장, 20.5 S1)
# 실행: docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
# 모든 포트는 127.0.0.1 에만 바인딩한다 (사양서 9.6: DB·Redis·스토리지는 외부 비공개).
name: famlog

services:
  postgres:
    build: ./postgres
    image: famlog/postgres:16-postgis-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # S3 호환 저장소. MinIO는 커뮤니티 Docker 이미지 배포가 중단되어 SeaweedFS로 대체했다 (2026-11-13 결정).
  # 운영은 실제 S3를 쓰고, 앱 코드는 S3 API(AWS SDK)만 사용한다.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ["/bin/sh", "/famlog/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"   # S3 API
      - "127.0.0.1:${S3_FILER_PORT:-8888}:8888" # 파일 브라우저 (확인용)
    volumes:
      - ./seaweedfs:/famlog:ro
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ["/bin/sh", "/famlog/create-buckets.sh"]
    environment:
      S3_BUCKETS: ${S3_BUCKET_MEDIA}
    volumes:
      - ./seaweedfs:/famlog:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
