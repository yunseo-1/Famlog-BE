plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.famlog'
version = '0.0.1-SNAPSHOT'
description = 'FamLog API 서버'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.22.0'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.22.0'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    // S3 Presigned URL·객체 확인 (로컬 SeaweedFS, 운영 S3). 동기 클라이언트만 쓰므로 Netty 비동기 클라이언트는 뺀다
    implementation platform('software.amazon.awssdk:bom:2.57.8')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    // FCM HTTP v1 호출용 OAuth 토큰 (서비스 계정). 발송은 RestClient로 직접 한다 (firebase-admin은 쓰지 않는 의존성이 많다)
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.57.0'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트 DB 이미지(infra/postgres)를 빌드할 때 저장소 루트 기준 경로를 쓴다
    systemProperty 'famlog.repoRoot', rootDir.absolutePath
}

// API 계약 docs/api/openapi.yaml 을 지금 코드로 다시 만든다 (Docker 필요: 테스트 컨텍스트로 생성)
// 문서 레포로 옮기기: sh scripts/export-openapi.sh <문서 레포 경로>
tasks.register('updateOpenApi', Test) {
    description = 'docs/api/openapi.yaml 을 현재 API로 다시 만든다'
    group = 'documentation'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.famlog.OpenApiContractTest.저장된_API_계약이_지금_코드와_같다'
    }
    systemProperty 'famlog.repoRoot', rootDir.absolutePath
    systemProperty 'famlog.openapi.write', 'true'
    outputs.upToDateWhen { false }
}
