# PR마다, main 반영 시 서버 테스트 실행 (사양서 13.2 CI/CD, 20.5 S2)
# Testcontainers가 ubuntu 러너의 Docker로 infra/postgres 이미지를 빌드해 쓴다.
name: backend-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7
