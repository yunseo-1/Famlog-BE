openapi: 3.1.0
info:
  description: |
    FamLog(팸로그) 가족 앱 서버 API. 기준: 통합 사양서 v2.0 11장.
    - 시각은 +09:00 ISO-8601, 날짜만은 YYYY-MM-DD
    - 실패 응답은 모두 ErrorResponse {code, message, traceId}. 앱은 code로 분기한다
    - 401: AUTH_TOKEN_EXPIRED 면 /auth/refresh 후 재시도, AUTH_INVALID 면 로그인 화면
  title: FamLog API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/v1/auth/logout:
    post:
      description: 이 기기의 세션을 폐기한다. 모르는 토큰이어도 204
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      security: []
      summary: 로그아웃
      tags:
      - auth-controller
  /api/v1/auth/refresh:
    post:
      description: Refresh 토큰을 교체한다. 같은 토큰으로 동시에 두 번 부르지 않는다
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      security: []
      summary: 토큰 재발급
      tags:
      - auth-controller
  /api/v1/auth/{provider}/login:
    post:
      description: 가입되지 않은 계정이면 404 USER_NOT_REGISTERED → 가입 API로
      operationId: login
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      security: []
      summary: 소셜 로그인
      tags:
      - auth-controller
  /api/v1/auth/{provider}/signup:
    post:
      description: 약관 동의 + 닉네임 + 출생연도월. 만 14세 미만이면 403 AGE_RESTRICTED
      operationId: signup
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      security: []
      summary: 소셜 가입
      tags:
      - auth-controller
  /api/v1/devices/token:
    delete:
      description: 이 기기로 푸시를 받지 않는다. 없으면 그대로 204
      operationId: unregister
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 푸시 토큰 삭제
      tags:
      - device-token-controller
    put:
      description: "앱 시작·토큰 갱신(onNewToken) 때 부른다. 이 기기의 이전 토큰은 바뀌고, 같은 토큰이 다른 계정에\
        \ 있으면 옮겨진다. 로그아웃·원격 로그아웃하면 서버가 지운다"
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTokenRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 푸시 토큰 등록·갱신
      tags:
      - device-token-controller
  /api/v1/groups:
    post:
      description: 만든 사람은 그룹장(OWNER). 단체 채팅방이 함께 생기고 현재 그룹이 된다
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetailResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 그룹 만들기
      tags:
      - group-controller
  /api/v1/groups/join:
    post:
      description: "없는 코드 404, 만료 410 INVITE_EXPIRED, 연속 5회 실패 시 10분 잠금 429. 이미 구성\
        원이면 그대로 200"
      operationId: join
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetailResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 초대 코드로 참여
      tags:
      - group-controller
  /api/v1/groups/me:
    get:
      description: 채팅 탭(SCR-10)·그룹 전환(SCR-70)용
      operationId: myGroups
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummaryResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 내 그룹 목록
      tags:
      - group-controller
  /api/v1/groups/{groupId}:
    delete:
      description: 즉시 접근이 막히고 30일 뒤 파기된다
      operationId: delete
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 그룹 삭제 (그룹장)
      tags:
      - group-controller
    get:
      operationId: detail
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetailResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 그룹과 구성원
      tags:
      - group-controller
  /api/v1/groups/{groupId}/invites:
    post:
      description: 7일 유효. 재발급하면 이전 코드는 바로 만료
      operationId: issueInvite
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 초대 코드 발급·재발급 (그룹장·관리자)
      tags:
      - group-controller
  /api/v1/groups/{groupId}/leave:
    post:
      description: 다른 구성원이 있는 그룹장은 409 OWNER_TRANSFER_REQUIRED. 혼자 남은 그룹장이 나가면 그룹
        삭제 예정
      operationId: leave
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 나가기
      tags:
      - group-controller
  /api/v1/groups/{groupId}/members/me:
    patch:
      description: 보낸 값만 바꾼다 (SCR-03)
      operationId: updateMe
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyMemberRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 내 가족 역할·호칭·캘린더 색
      tags:
      - group-controller
  /api/v1/groups/{groupId}/members/me/preferences:
    get:
      operationId: groupPreferences
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPreferencesResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 이 그룹 알림·AI 분석 제외 설정
      tags:
      - notification-settings-controller
    patch:
      description: "보낸 값만 바꾼다. 알림을 끄면 새 메시지 푸시가 오지 않고, AI 분석 제외를 켜면 내 메시지를 AI 분석에\
        \ 보내지 않는다 (제외했던 동안의 메시지는 다시 켜도 보내지 않는다)"
      operationId: updateGroupPreferences
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPreferencesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPreferencesResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 이 그룹 알림·AI 분석 제외 바꾸기
      tags:
      - notification-settings-controller
  /api/v1/groups/{groupId}/members/{userId}:
    delete:
      description: 그룹장은 내보낼 수 없다
      operationId: kick
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 내보내기 (그룹장·관리자)
      tags:
      - group-controller
    patch:
      description: role=OWNER 는 위임이며 그룹장만 가능
      operationId: changeRole
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 권한 변경·그룹장 위임 (그룹장·관리자)
      tags:
      - group-controller
  /api/v1/groups/{groupId}/messages:
    get:
      description: "afterSeq: 그 다음부터 오래된 순(재접속 동기화) / beforeSeq: 그 이전 최신 size개(위로\
        \ 스크롤) / 둘 다 없으면 최신 size개. items는 언제나 seq 오름차순. 들어오기 전 메시지는 보이지 않는다"
      operationId: messages
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: afterSeq
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: beforeSeq
        required: false
        schema:
          type: integer
          format: int64
      - description: "기본 50, 최대 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 메시지 내역
      tags:
      - chat-controller
  /api/v1/groups/{groupId}/place-aliases:
    get:
      description: 별칭 이름 순
      operationId: listPlaceAliases
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 별칭 장소 목록
      tags:
      - place-alias-controller
    post:
      description: '"할머니 댁"처럼 검색이 안 되는 곳. 공유한 장소 연결·주소 메모는 선택. 같은 별칭이 있으면 409 ALIAS_DUPLICATED'
      operationId: createPlaceAlias
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAliasRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 별칭 장소 만들기
      tags:
      - place-alias-controller
  /api/v1/groups/{groupId}/place-aliases/{aliasId}:
    delete:
      description: 만든 사람이나 ADMIN 이상. 다른 그룹 별칭이면 404
      operationId: deletePlaceAlias
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: aliasId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 별칭 장소 삭제
      tags:
      - place-alias-controller
  /api/v1/groups/{groupId}/places:
    get:
      description: "최신 공유 순, 커서 페이징. region1(시·도)·region2(시·군·구, region1 필요), sharedBy·\
        category(여러 개), 지도 영역(swLat·swLng·neLat·neLng 모두)을 함께 걸 수 있다"
      operationId: listPlaces
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: region1
        required: false
        schema:
          type: string
      - in: query
        name: region2
        required: false
        schema:
          type: string
      - description: 공유한 사람 userId 여러 개
        in: query
        name: sharedBy
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
      - in: query
        name: category
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - RESTAURANT
            - CAFE
            - TRAVEL
            - LIFE
            - ETC
          uniqueItems: true
      - in: query
        name: swLat
        required: false
        schema:
          type: number
          format: double
      - in: query
        name: swLng
        required: false
        schema:
          type: number
          format: double
      - in: query
        name: neLat
        required: false
        schema:
          type: number
          format: double
      - in: query
        name: neLng
        required: false
        schema:
          type: number
          format: double
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 장소 목록
      tags:
      - place-controller
    post:
      description: "검색 결과의 kakaoPlaceId 로 공유한다 (검색 후 1시간 안, 지나면 400). 같은 그룹에 이미 있으\
        면 409 PLACE_ALREADY_SHARED. shareToChat(기본 true)이면 채팅방에 장소 카드(PLACE)"
      operationId: sharePlace
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharePlaceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실패. code 로 원인을 구분한다
      summary: 장소 공유
      tags:
      - place-controller
  /api/v1/groups/{groupId}/places/nearby:
    get:
      description: "가까운 순 최대 50곳. 현재 위치는 저장하지 않는다. 기능이 꺼져 있으면 404 (앱은 버튼을 숨긴다), 위치\
        기반서비스 동의가 없으면 403 LOCATION_CONSENT_REQUIRED"
      operationId: nearbyPlaces
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: lat
        required: true
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
      - in: query
        name: lng
        required: true
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
      - in: query
        name: radiusKm
        required: false
        schema:
          type: number
          format: double
          default: 3.0
          maximum: 20.0
          minimum: 1.0
      responses:
        "200":
