  /api/v1/users/me/consents/{type}:
    put:
      description: "지금은 LOCATION(위치기반서비스 이용약관 + 개인위치정보 수집·이용)만. 동의 {agreed:true, docVersion}(현\
        재 버전과 다르면 400), 철회 {agreed:false} → 내가 올린 사진의 위치도 지운다. TERMS·PRIVACY·AI_ANALYSIS·\
        OVERSEAS_TRANSFER 는 400"
      operationId: updateConsent
      parameters:
      - in: path
        name: type
        required: true
        schema:
          type: string
