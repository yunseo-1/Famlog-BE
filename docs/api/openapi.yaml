components:
  schemas:
    AgreementsRequest:
      type: object
      properties:
        privacyVersion:
          type: string
          description: 동의한 개인정보 수집·이용 버전
          maxLength: 20
          minLength: 0
        termsVersion:
          type: string
          description: 동의한 이용약관 버전
          maxLength: 20
          minLength: 0
      required:
      - privacyVersion
      - termsVersion
    AliasListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AliasResponse"
    AliasResponse:
      type: object
      properties:
        addressText:
          type: string
        alias:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        place:
          $ref: "#/components/schemas/PlaceSummary"
          description: 연결한 장소 (없거나 지워졌으면 null)
    AuthResponse:
      type: object
      properties:
        tokens:
          $ref: "#/components/schemas/TokenResponse"
        user:
          $ref: "#/components/schemas/UserResponse"
    ChangeRoleRequest:
      type: object
      properties:
        role:
          type: string
          description: OWNER로 바꾸면 그룹장 위임 (그룹장만 가능)
          enum:
          - MEMBER
          - ADMIN
          - OWNER
      required:
      - role
    ConflictListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConflictResponse"
    ConflictResponse:
      type: object
      properties:
        allDay:
          type: boolean
        endsAt:
          type: string
          format: date-time
        scheduleId:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
        title:
          type: string
        userIds:
          type: array
          items:
            type: integer
            format: int64
    ConsentListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConsentResponse"
    ConsentResponse:
      type: object
      properties:
        agreed:
          type: boolean
        agreedAt:
          type: string
          format: date-time
        currentVersion:
          type: string
        docVersion:
          type: string
        reconsentRequired:
          type: boolean
        type:
          type: string
          enum:
          - TERMS
          - PRIVACY
          - AI_ANALYSIS
          - OVERSEAS_TRANSFER
          - LOCATION
    CreateAliasRequest:
      type: object
      properties:
        addressText:
          type: string
          description: 주소 메모 (선택)
          maxLength: 200
          minLength: 0
        alias:
          type: string
          example: 할머니 댁
          maxLength: 30
          minLength: 0
        placeId:
          type: integer
          format: int64
          description: "연결할 공유 장소 (이 그룹 장소, 선택)"
      required:
      - alias
    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          example: 우리 가족
          maxLength: 30
          minLength: 0
      required:
      - name
    CreateTodoRequest:
      type: object
      properties:
        assigneeId:
          type: integer
          format: int64
          description: 담당자 userId (이 그룹 가족). 없으면 담당자 없음
        dueDate:
          type: string
          format: date
          description: 기한 (서울 날짜)
          example: 2026-11-21
        kind:
          type: string
          description: TASK 만 (SHOPPING 은 v1.1). 없으면 TASK
          enum:
          - TASK
          - SHOPPING
        title:
          type: string
          example: 우유 사 오기
          maxLength: 100
          minLength: 0
      required:
      - title
    CurrentGroupRequest:
      type: object
      properties:
        groupId:
          type: integer
          format: int64
      required:
      - groupId
    DeviceRequest:
      type: object
      properties:
        deviceId:
          type: string
          description: 앱 설치마다 만든 무작위 ID
          maxLength: 100
          minLength: 0
        deviceName:
          type: string
          description: "기기 관리 화면에 보일 이름 (예: Galaxy S25)"
          maxLength: 100
          minLength: 0
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
      required:
      - deviceId
      - platform
    ErrorResponse:
      properties:
        code:
          type: string
          description: 에러 코드 (사양서 11.2)
          enum:
          - VALIDATION_FAILED
          - AUTH_TOKEN_EXPIRED
          - AUTH_INVALID
          - GROUP_NOT_MEMBER
          - GROUP_ROLE_REQUIRED
          - LOCATION_CONSENT_REQUIRED
          - MESSAGE_NOT_DELETABLE
          - AGE_RESTRICTED
          - NOT_FOUND
          - USER_NOT_REGISTERED
          - METHOD_NOT_ALLOWED
          - CANDIDATE_ALREADY_DECIDED
          - VERSION_CONFLICT
          - GROUP_LIMIT_EXCEEDED
          - OWNER_TRANSFER_REQUIRED
          - PLACE_ALREADY_SHARED
          - ALIAS_DUPLICATED
          - INVITE_EXPIRED
          - CANDIDATE_MISSING_FIELDS
          - UPGRADE_REQUIRED
          - RATE_LIMITED
          - INTERNAL_ERROR
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        message:
          type: string
        traceId:
          type: string
    FieldError:
      properties:
        field:
          type: string
        reason:
          type: string
    GroupDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        imageKey:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberResponse"
        myRole:
          type: string
          enum:
          - MEMBER
          - ADMIN
          - OWNER
        name:
          type: string
    GroupPreferencesRequest:
      type: object
      properties:
        aiOptOut:
          type: boolean
          description: 내 메시지 AI 분석 제외 (이 그룹)
        notifMuted:
          type: boolean
          description: 이 그룹 알림 끄기
    GroupPreferencesResponse:
      type: object
      properties:
        aiOptOut:
          type: boolean
        notifMuted:
          type: boolean
    GroupSettingsResponse:
      type: object
      properties:
        aiAnalysisEnabled:
          type: boolean
        aiEnabledAt:
          type: string
          format: date-time
    GroupSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        imageKey:
          type: string
        lastMessage:
          $ref: "#/components/schemas/LastMessage"
        memberCount:
          type: integer
          format: int64
        myRole:
          type: string
          enum:
          - MEMBER
