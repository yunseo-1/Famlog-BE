          - OWNER
        name:
          type: string
        unreadCount:
          type: integer
          format: int64
    HolidayListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HolidayResponse"
    HolidayResponse:
      type: object
      properties:
