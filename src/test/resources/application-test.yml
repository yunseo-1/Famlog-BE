# 테스트 프로필: DB 접속 정보는 Testcontainers(@ServiceConnection)가 넣는다. infra/.env 를 읽지 않는다.
# 테스트 전용 컨트롤러(support.web)는 API 계약(openapi.yaml)에 넣지 않는다
springdoc:
  packages-to-exclude: com.famlog.support

logging:
  level:
    com.famlog: DEBUG

# 리마인드·AI 트리거 스케줄러는 테스트가 시각을 정해 직접 부른다 (ReminderService.sendDue, AiTriggerService.runDue)
famlog:
  admin:
    token: test-admin-token
  account:
    purge-enabled: false
  data-export:
    ticker-enabled: false
  cleanup:
    enabled: false
  stream-reclaim:
    enabled: false
    min-idle: 0s
  schedule:
    reminder-enabled: false
  ai:
    ticker-enabled: false
management:
  server:
    port: 0   # 관리 포트도 무작위 (테스트는 @LocalManagementPort 로 부른다)

