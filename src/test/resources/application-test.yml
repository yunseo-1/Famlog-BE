# 테스트 프로필: DB 접속 정보는 Testcontainers(@ServiceConnection)가 넣는다. infra/.env 를 읽지 않는다.
# 테스트 전용 컨트롤러(support.web)는 API 계약(openapi.yaml)에 넣지 않는다
springdoc:
  packages-to-exclude: com.famlog.support

logging:
  level:
    com.famlog: DEBUG

# 리마인드 스케줄러는 테스트가 시각을 정해 직접 부른다 (ReminderService.sendDue)
famlog:
  schedule:
    reminder-enabled: false
