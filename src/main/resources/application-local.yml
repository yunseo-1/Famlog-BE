# 로컬 개발: infra/.env 를 그대로 읽어 Docker Compose 인프라에 접속한다 (값을 두 곳에 쓰지 않는다).
# 저장소 루트에서 실행해야 한다 (./gradlew bootRun, IntelliJ 작업 디렉터리 = 저장소 루트).
spring:
  config:
    import: optional:file:./infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

# JWT 서명 키: infra/scripts/gen-jwt-key.sh 가 infra/.env 에 만들어 둔다
# 소셜 로그인 값이 비어 있으면 해당 제공자 로그인만 실패한다 (서버는 뜬다)
famlog:
  social:
    kakao:
      app-id: ${KAKAO_APP_ID:}
    google:
      client-ids: ${GOOGLE_CLIENT_ID:}
  # 로컬 SeaweedFS. 앱(에뮬레이터)이 올릴 주소는 S3_PUBLIC_ENDPOINT (기본: Mac에서 확인용 localhost)
  media:
    s3:
      endpoint: http://localhost:${S3_PORT:8333}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:${S3_PORT:8333}}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET_MEDIA:famlog-media}
  # 카카오 로컬(장소 검색) REST API 키. 비어 있으면 장소 검색만 실패한다
  place:
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
  # FCM 서비스 계정 키 (저장소 밖 경로). 비어 있으면 푸시를 보내지 않고 로그만 남긴다
  push:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  # 관리자 도구 토큰 (infra/.env FAMLOG_ADMIN_TOKEN)
  admin:
    token: ${FAMLOG_ADMIN_TOKEN:}
  auth:
    jwt:
      active-kid: ${JWT_ACTIVE_KID}
      keys:
        - kid: ${JWT_ACTIVE_KID}
          private-key: ${JWT_PRIVATE_KEY}
          public-key: ${JWT_PUBLIC_KEY}

logging:
  level:
    com.famlog: DEBUG
