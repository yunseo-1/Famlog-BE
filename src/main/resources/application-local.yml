# 로컬 개발: infra/.env 를 그대로 읽어 Docker Compose 인프라에 접속한다 (값을 두 곳에 쓰지 않는다).
# 저장소 루트에서 실행해야 한다 (./gradlew bootRun, IntelliJ 작업 디렉터리 = 저장소 루트).
spring:
  config:
    import: optional:file:./infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

# JWT 서명 키: infra/scripts/gen-jwt-key.sh 가 infra/.env 에 만들어 둔다
# 소셜 로그인 값이 비어 있으면 해당 제공자 로그인만 실패한다 (서버는 뜬다)
famlog:
  social:
    kakao:
      app-id: ${KAKAO_APP_ID:}
    google:
      client-ids: ${GOOGLE_CLIENT_ID:}
  auth:
    jwt:
      active-kid: ${JWT_ACTIVE_KID}
      keys:
        - kid: ${JWT_ACTIVE_KID}
          private-key: ${JWT_PRIVATE_KEY}
          public-key: ${JWT_PUBLIC_KEY}

logging:
  level:
    com.famlog: DEBUG
