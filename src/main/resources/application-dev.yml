# 테스트 서버: 모든 비밀은 환경 변수로만 받는다 (사양서 9.4)
#
# JWT 서명 키도 환경 변수로 넣는다 (목록이라 인덱스를 붙인다):
#   FAMLOG_AUTH_JWT_ACTIVE_KID=k2026a
#   FAMLOG_AUTH_JWT_KEYS_0_KID=k2026a  FAMLOG_AUTH_JWT_KEYS_0_PRIVATE_KEY=...  FAMLOG_AUTH_JWT_KEYS_0_PUBLIC_KEY=...
# 키 교체 중에는 이전 키를 KEYS_1_KID / KEYS_1_PUBLIC_KEY 로 남긴다 (검증 전용, 개인 키 불필요).
#
# 소셜 로그인: FAMLOG_SOCIAL_KAKAO_APP_ID=123456  FAMLOG_SOCIAL_GOOGLE_CLIENT_IDS=xxx.apps.googleusercontent.com
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  forward-headers-strategy: native   # Nginx 뒤: X-Forwarded-For 로 실제 IP (요청 제한 기준)

logging:
  structured:
    format:
      console: ecs
