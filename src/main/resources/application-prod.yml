# 운영: 모든 비밀은 환경 변수로만 받는다 (사양서 9.4). API 문서는 외부에 열지 않는다.
# JWT 서명 키·소셜 로그인 환경 변수 이름은 application-dev.yml 주석 참고.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  forward-headers-strategy: native   # Nginx 뒤: X-Forwarded-For 로 실제 IP (요청 제한 기준)

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
