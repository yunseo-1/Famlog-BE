# 공통 설정. 환경별 값은 application-{local,dev,prod}.yml (사양서 13.3 환경 분리)
spring:
  application:
    name: famlog-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway로만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # timestamptz UTC 저장 (사양서 10장)
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      timeout: 2s                 # Redis 장애가 요청을 오래 붙잡지 않게
      connect-timeout: 2s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

# Actuator: health만 공개, 상세 정보 숨김 (사양서 9.6)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  packages-to-scan: com.famlog
  writer-with-order-by-keys: true   # 내보낸 openapi.yaml 이 매번 같은 순서가 되게

logging:
  structured:
    json:
      customizer: com.famlog.common.logging.MaskingJsonMembersCustomizer

famlog:
  # 인증 (사양서 9.2). 서명 키(famlog.auth.jwt.*)는 환경별 설정에서 넣는다
  auth:
    issuer: famlog
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  # 소셜 로그인 (사양서 4.1 AUTH-01). 카카오 앱 ID·Google 클라이언트 ID는 환경별 설정에서 넣는다
  social:
    kakao:
      base-url: https://kapi.kakao.com
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  # 가족 그룹 (사양서 2.1, 4.1 GRP-01~05)
  group:
    max-members: 20
    max-groups-per-user: 10
    invite-ttl: 7d
    invite-link-base-url: https://famlog.app/invite/   # 도메인이 정해지면 바꾼다 (App Links)
    invite-max-failures: 5
    invite-lock-duration: 10m
    deletion-grace: 30d
    # 구성원 캘린더 색 12색. 앞 4색은 디자인 토큰 memberColorSamples, 나머지는 임시 제안 → 디자인 확정 시 교체
    calendar-palette: ["#14A3B8", "#E5568D", "#E8A33C", "#7BB33A", "#4C8DF0", "#A66BD3",
                       "#D9534F", "#8D6E63", "#607D8B", "#F2C94C", "#5C6BC0", "#FF8A65"]
  # 채팅 (사양서 4.2 CHAT-02~04, 9.6 메시지 초당 5개/사용자)
  chat:
    send-rate-capacity: 5
    send-rate-period: 1s
    default-page-size: 50
    max-page-size: 100
  # 사진·동영상 (사양서 4.2 CHAT-05, 8.6, 9.1). S3 접속 값은 환경별 설정에서 넣는다
  media:
    max-items: 30
    max-image-size: 30MB
    max-video-size: 500MB
    max-video-seconds: 300
    upload-url-ttl: 10m
    download-url-ttl: 10m
    # 사진 위치 저장. 위치기반서비스 신고를 확인하기 전까지 끈다 (사양서 8.6 출시 전 할 일)
    photo-location-enabled: false
  # 푸시 (사양서 4.2 NOTI-01). FCM 서비스 계정 키 경로(famlog.push.credentials-path)는 환경별 설정에서 넣는다.
  # 비어 있으면 보내지 않고 로그만 남긴다 (CI·테스트·키 없는 로컬)
  push:
    fcm-base-url: https://fcm.googleapis.com
    connect-timeout: 3s
    read-timeout: 10s
    preview-max-length: 100
  # 일정 (사양서 4.3 SCH-03). 리마인드 스케줄러(1분마다). 테스트는 끄고 직접 부른다
  schedule:
    reminder-enabled: true
  # 장소 (사양서 4.4 PLC-01~06, 8.6). 카카오 REST API 키(famlog.place.kakao-rest-api-key)는 환경별 설정에서 넣는다.
  # 비어 있으면 장소 검색만 500 (CI·테스트·키 없는 로컬)
  place:
    kakao-base-url: https://dapi.kakao.com
    document-cache-ttl: 1h     # 검색 결과의 장소를 이 시간 안에 공유할 수 있다
    search-cache-ttl: 10m      # 위치 없이 검색한 결과 목록 캐시
    search-rate-capacity: 30
    search-rate-period: 1m
    # 내 주변 검색. 위치기반서비스 신고를 확인하고 출시 전에 운영 값을 정한다 (사양서 8.6 출시 전 할 일)
    nearby-enabled: true
    default-page-size: 50
    max-page-size: 100
    # 카카오 분류 코드(category_group_code) → 앱 카테고리. 없는 코드는 ETC
    category-map:
      FD6: RESTAURANT   # 음식점
      CE7: CAFE         # 카페
      AT4: TRAVEL       # 관광명소
      AD5: TRAVEL       # 숙박
      CT1: ETC          # 문화시설: 영화관·공연장이 섞여 있어 여행지로 추천하지 않는다
      HP8: LIFE         # 병원
      PM9: LIFE         # 약국
      MT1: LIFE         # 대형마트
      CS2: LIFE         # 편의점
      BK9: LIFE         # 은행
      PO3: LIFE         # 공공기관
      OL7: LIFE         # 주유소·충전소
      SW8: LIFE         # 지하철역
      PK6: LIFE         # 주차장
  # AI 대화 분석 (사양서 4.5 ARC-01, 6.2 ①, 8.7). 그룹 AI 분석이 켜진 그룹의 분석 대상 메시지만 워커(famlog:ai.extract)로 보낸다
  ai:
    enabled: true          # 전체 끄기 스위치
    ticker-enabled: true   # 5초마다 분석 시각이 된 방을 꺼낸다. 테스트는 끄고 직접 부른다
    pause: 5s              # 규칙 필터에 걸린 뒤 대화가 멈추면
    batch-idle: 10m        # 보조 분석: 대화가 멈추면
    batch-size: 30         # 보조 분석: 분석 안 된 메시지가 쌓이면 바로
    context-size: 20       # 앞 맥락
    max-messages: 50       # 한 요청의 분석 구간 최대 (넘으면 최근 것만)
    limits:                # 사양서 7.2 비용 관리
      daily-calls-per-group: 100   # 그룹별 하루(KST) 분석 요청 수
      monthly-budget-usd: 20       # 월(UTC) 전체 비용 상한. 닿으면 새 요청을 만들지 않는다
      warn-ratio: 0.8              # 넘으면 그달에 한 번 경고 로그
    pricing:               # claude-haiku-5-5, 100만 토큰당 달러 (프롬프트 10만 토큰 이하)
      input: 0.10
      output: 0.50
      cache-read: 0.01
      cache-write: 0.125           # 5분 캐시 쓰기 = 입력 × 1.25
  # 계정 삭제 (사양서 4.1 ACC-01, 8.9): 요청 뒤 30일 유예(로그인하면 복구), 매일 04:00 파기 배치
  account:
    deletion-grace: 30d
    purge-enabled: true
  # 내 데이터 내보내기 (사양서 4.1 ACC-02). ZIP 과 원본 링크는 7일 유효, 만든 뒤 24시간 안에는 다시 요청할 수 없다
  data-export:
    link-ttl: 7d
    download-url-ttl: 10m
    cooldown: 24h
    max-attempts: 3
    ticker-enabled: true
  # 운영 정리 배치 (사양서 8.2 보관·파기): 그룹 파기 04:30, 미디어 정리 매시, 보관 기간 정리 04:45 (KST)
  cleanup:
    enabled: true
    unattached-media-after: 24h
    sessions-after: 90d
    invites-after: 30d
    reminder-sends-after: 30d
    location-logs-after: 180d
    reports-after: 365d
    candidates-after: 365d
    audit-logs-after: 365d
    data-exports-after: 30d
  # 워커 결과 스트림의 멈춘 대기 메시지 회수: 1분마다, 5분 넘게 확인되지 않은 것을 다시 처리하고 3번이면 DLQ
  stream-reclaim:
    enabled: true
    min-idle: 5m
    max-deliveries: 3
  # 최소 관리자 도구 (사양서 14장, /admin). 토큰은 환경변수 FAMLOG_ADMIN_TOKEN. 비어 있으면 관리자 API 가 꺼진다(404)
  admin:
    token: ""
  # 현재 약관 버전 (사양서 8.3). 정책 문서(S22)를 고치면 올린다
  consent:
    terms-version: "1.0"
    privacy-version: "1.0"
    location-version: "1.0"   # 위치기반서비스 이용약관 + 개인위치정보 수집·이용 (선택)
    # AI 분석 안내 (SET-01, 사양서 8.3·8.7). 문구를 고치면 version 을 올린다 → 모두 다시 안내받는다
    # 보관 기간·받는 자 문구는 초안: Anthropic 데이터 처리 조건 확인·법률 검토 후 확정 (S22 전)
    ai-notice:
      version: "1.0"
      recipient: "Anthropic, PBC (AI 모델 제공자)"
      country: "미국"
      sent-items:
        - "AI 분석을 켠 뒤 채팅방에 올라온 글 메시지 중 분석 구간 (전화번호·계좌번호 등은 가린 뒤)"
        - "가족 구성원의 가족 역할·호칭 (이름 대신 M1, M2 같은 임시 번호)"
      not-sent-items:
        - "사진·동영상·음성"
        - "이름·닉네임·연락처"
        - "내 메시지 분석 제외를 켠 사람의 메시지"
      purpose: "채팅에서 일정·기념일·할 일·장소를 찾아 등록 후보로 제안"
      retention: "제공자는 요청 처리 후 정해진 기간 안에 삭제하며 모델 학습에 쓰지 않습니다 (초안: 확정 전)"
      # 앱 실제 경로에 맞춤. 출시 전이라 확인한 실제 사용자가 없어 version 은 그대로 (S22 보관 문구 확정 때 올린다)
      refusal: "채팅방 메뉴(≡) > 그룹 설정에서 언제든 '내 메시지 분석 제외'를 켜면 이후 내 메시지는 보내지 않습니다"
  # 요청 제한 (사양서 9.6). 메시지 초당 5개(WebSocket)는 S8, AI 요청 그룹별 상한은 S16에서 추가
  rate-limit:
    enabled: true
    rules:
      - name: login
        method: POST
        path: /api/v1/auth/{provider}/login
        key: IP
        capacity: 10
        period: 1m
      - name: login                # 가입도 로그인과 같은 한도를 나눠 쓴다 (같은 name = 같은 버킷)
        method: POST
        path: /api/v1/auth/{provider}/signup
        key: IP
        capacity: 10
        period: 1m
      - name: refresh
        method: POST
        path: /api/v1/auth/refresh
        key: IP
        capacity: 30
        period: 1m
      - name: invite-join
        method: POST
        path: /api/v1/groups/join
        key: USER
        capacity: 5
        period: 1m
