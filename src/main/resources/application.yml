# 공통 설정. 환경별 값은 application-{local,dev,prod}.yml (사양서 13.3 환경 분리)
spring:
  application:
    name: famlog-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway로만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # timestamptz UTC 저장 (사양서 10장)
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      timeout: 2s                 # Redis 장애가 요청을 오래 붙잡지 않게
      connect-timeout: 2s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

# Actuator: health만 공개, 상세 정보 숨김 (사양서 9.6)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

logging:
  structured:
    json:
      customizer: com.famlog.common.logging.MaskingJsonMembersCustomizer

famlog:
  # 인증 (사양서 9.2). 서명 키(famlog.auth.jwt.*)는 환경별 설정에서 넣는다
  auth:
    issuer: famlog
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  # 소셜 로그인 (사양서 4.1 AUTH-01). 카카오 앱 ID·Google 클라이언트 ID는 환경별 설정에서 넣는다
  social:
    kakao:
      base-url: https://kapi.kakao.com
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  # 가족 그룹 (사양서 2.1, 4.1 GRP-01~05)
  group:
    max-members: 20
    max-groups-per-user: 10
    invite-ttl: 7d
    invite-link-base-url: https://famlog.app/invite/   # 도메인이 정해지면 바꾼다 (App Links)
    invite-max-failures: 5
    invite-lock-duration: 10m
    deletion-grace: 30d
    # 구성원 캘린더 색 12색. 앞 4색은 디자인 토큰 memberColorSamples, 나머지는 임시 제안 → 디자인 확정 시 교체
    calendar-palette: ["#14A3B8", "#E5568D", "#E8A33C", "#7BB33A", "#4C8DF0", "#A66BD3",
                       "#D9534F", "#8D6E63", "#607D8B", "#F2C94C", "#5C6BC0", "#FF8A65"]
  # 현재 약관 버전 (사양서 8.3). 정책 문서(S22)를 고치면 올린다
  consent:
    terms-version: "1.0"
    privacy-version: "1.0"
  # 요청 제한 (사양서 9.6). 메시지 초당 5개(WebSocket)는 S8, AI 요청 그룹별 상한은 S16에서 추가
  rate-limit:
    enabled: true
    rules:
      - name: login
        method: POST
        path: /api/v1/auth/{provider}/login
        key: IP
        capacity: 10
        period: 1m
      - name: login                # 가입도 로그인과 같은 한도를 나눠 쓴다 (같은 name = 같은 버킷)
        method: POST
        path: /api/v1/auth/{provider}/signup
        key: IP
        capacity: 10
        period: 1m
      - name: refresh
        method: POST
        path: /api/v1/auth/refresh
        key: IP
        capacity: 30
        period: 1m
      - name: invite-join
        method: POST
        path: /api/v1/groups/join
        key: USER
        capacity: 5
        period: 1m
